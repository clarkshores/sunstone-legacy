name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical bundle matches the manifest
        run: node tools/verify-manifest.mjs

      - name: Publish gate clears the canonical bundle
        run: node tools/verify-before-publish.mjs artifact/sunstone-v0.14.CANONICAL.html

      - name: Publish gate refuses the regressions it exists to catch
        run: |
          C=artifact/sunstone-v0.14.CANONICAL.html
          T=$(mktemp -d)

          expect_rc() {
            local want=$1 label=$2 file=$3
            set +e
            node tools/verify-before-publish.mjs "$file" >/dev/null 2>&1
            local got=$?
            set -e
            if [ "$got" != "$want" ]; then
              echo "FAIL: $label — expected rc $want, got $got"
              exit 1
            fi
            echo "ok: $label (rc $got)"
          }

          sed 's/"0\.14\.0-artifact"/"0.7.0-artifact"/' "$C" > "$T/old.html"
          expect_rc 1 "an older build is blocked" "$T/old.html"

          printf '<html>no build id</html>' > "$T/none.html"
          expect_rc 1 "a bundle with no build id is blocked" "$T/none.html"

          printf '<html>"1.2.3-artifact" and "9.9.9-artifact"</html>' > "$T/ambig.html"
          expect_rc 1 "an ambiguous build id is blocked" "$T/ambig.html"

          cp "$C" "$T/unbumped.html"; printf '<!--edit-->' >> "$T/unbumped.html"
          expect_rc 1 "an edit that did not bump its build id is blocked" "$T/unbumped.html"

          sed 's/"0\.14\.0-artifact"/"0.15.0-artifact"/' "$C" > "$T/new.html"
          expect_rc 0 "a newer build is cleared" "$T/new.html"

      - name: Deploy build reproduces the canonical bundle byte for byte
        run: |
          node tools/verify-manifest.mjs && mkdir -p public \
            && cp artifact/sunstone-v0.14.CANONICAL.html public/index.html
          a=$(sha256sum public/index.html | cut -d' ' -f1)
          b=$(node -e "console.log(require('./artifact/MANIFEST.json').canonical.sha256)")
          [ "$a" = "$b" ] || { echo "FAIL: deploy output $a != manifest $b"; exit 1; }
          echo "ok: deploy output matches the manifest ($a)"
